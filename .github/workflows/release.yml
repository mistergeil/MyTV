name: Release

# Release = change kiosk/vpn/VERSION (+ NOTES.txt) and push. The package is only built if all tests pass.
on:
  push:
    branches: [main]
    paths: ["kiosk/vpn/VERSION"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build MyTV-Windows.zip + version.json
        run: python tools/make_release.py --auto
      - name: Commit release
        run: |
          git config user.name "mytv-release"
          git config user.email "mytv-release@users.noreply.github.com"
          git add kiosk/MyTV-Windows.zip kiosk/version.json
          if git diff --cached --quiet; then echo "nothing to release"; exit 0; fi
          git commit -m "Release $(cat kiosk/vpn/VERSION)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((i * 7)); done; exit 1
