<!DOCTYPE html><html><head><meta charset="utf-8"><title>stream test</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>body{background:#111;color:#eee;font:14px sans-serif;margin:12px}table{border-collapse:collapse}td{padding:4px 10px;border-bottom:1px solid #333}.ok{color:#4c4}.bad{color:#e55}</style></head>
<body><h3>Stream test</h3><table id="t"></table>
<script>
const S = [
 ["Das Erste (int)","https://daserste-live.ard-mcdn.de/daserste/live/hls/int/master.m3u8"],
 ["Das Erste (de)","https://daserste-live.ard-mcdn.de/daserste/live/hls/de/master.m3u8"],
 ["tagesschau24","https://tagesschau-live.ard-mcdn.de/tagesschau/live/hls/int/master.m3u8"],
 ["tagesschau24 (alt)","https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8"],
 ["ZDF","https://zdf-hls-15.akamaized.net/hls/live/2016498/de/high/master.m3u8"],
 ["ZDFneo","https://zdf-hls-16.akamaized.net/hls/live/2016499/de/high/master.m3u8"],
 ["ZDFinfo","https://zdf-hls-17.akamaized.net/hls/live/2016500/de/high/master.m3u8"],
 ["3sat","https://zdf-hls-18.akamaized.net/hls/live/2016501/dach/high/master.m3u8"],
 ["phoenix","https://zdf-hls-19.akamaized.net/hls/live/2016502/de/high/master.m3u8"],
 ["arte DE","https://artesimulcast.akamaized.net/hls/live/2030993/artelive_de/index.m3u8"],
 ["ARD alpha","https://ardalpha-live.ard-mcdn.de/ardalpha/live/hls/int/master.m3u8"],
 ["BR","https://brlive-live.ard-mcdn.de/brlive/live/hls/int/master.m3u8"],
 ["WDR","https://wdrfs247-live.ard-mcdn.de/wdrfs247/live/hls/int/master.m3u8"],
 ["NDR","https://ndrfs-live.ard-mcdn.de/ndrfs/live/hls/int/master.m3u8"],
 ["SWR","https://swrbwd-live.ard-mcdn.de/swrbwd/live/hls/int/master.m3u8"],
 ["MDR","https://mdrsnhd-live.ard-mcdn.de/mdrsnhd/live/hls/int/master.m3u8"],
 ["hr","https://hrfs-live.ard-mcdn.de/hrfs/live/hls/int/master.m3u8"],
 ["rbb","https://rbb-live.ard-mcdn.de/rbb/live/hls/int/master.m3u8"],
 ["ONE","https://one-live.ard-mcdn.de/one/live/hls/int/master.m3u8"],
 ["KiKA","https://kika-live.ard-mcdn.de/kika/live/hls/int/master.m3u8"],
 ["DW Deutsch","https://dwamdstream106.akamaized.net/hls/live/2017965/dwstream106/index.m3u8"],
 ["SRF 1","https://srgssrch-live.akamaized.net/hls/live/srf1/master.m3u8"],
 ["ORF 1","https://orf1.mdn.ors.at/out/u/orf1/q8c/manifest.m3u8"]
];
const t = document.getElementById('t'); window.RESULTS = {};
function test([name,url]) {
  return new Promise(res => {
    const tr = t.insertRow(); tr.insertCell().textContent = name; const c = tr.insertCell(); c.textContent = '…';
    const v = document.createElement('video'); v.muted = true; v.width = 160; const h = new Hls();
    let done = false; const fin = (ok,msg) => { if (done) return; done = true; c.textContent = msg; c.className = ok?'ok':'bad'; window.RESULTS[name] = (ok?'OK ':'FAIL ')+msg; h.destroy(); res(); };
    h.on(Hls.Events.FRAG_LOADED, () => fin(true, 'plays (segment loaded)'));
    h.on(Hls.Events.ERROR, (e,d) => { if (d.fatal) fin(false, d.details + (d.response ? ' ' + d.response.code : '')); });
    setTimeout(() => fin(false,'timeout'), 15000);
    h.loadSource(url); h.attachMedia(v); v.play().catch(()=>{});
  });
}
(async () => { for (let i=0;i<S.length;i+=4) await Promise.all(S.slice(i,i+4).map(test)); window.DONE = true; })();
</script></body></html>
