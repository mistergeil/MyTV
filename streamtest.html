<!DOCTYPE html><html><head><meta charset="utf-8"><title>stream test</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>body{background:#111;color:#eee;font:14px sans-serif;margin:12px}table{border-collapse:collapse}td{padding:4px 10px;border-bottom:1px solid #333}.ok{color:#4c4}.bad{color:#e55}</style></head>
<body><h3>Stream test</h3><table id="t"></table>
<script>
const S = [
 ["ONE","https://mcdn-one.ard.de/ardone/hls/master.m3u8"],
 ["ARD alpha","https://mcdn.br.de/br/fs/ard_alpha/hls/de/master.m3u8"],
 ["KiKA","https://kikageohls.akamaized.net/hls/live/2022693/livetvkika_de/master.m3u8"],
 ["DW","https://dwamdstream111.akamaized.net/hls/live/2017972/dwstream111/index.m3u8"],
 ["MDR Sachsen","https://mdrtvsnhls.akamaized.net/hls/live/2016928/mdrtvsn/master.m3u8"],
 ["rbb Berlin","https://rbb-hls-berlin.akamaized.net/hls/live/2017824/rbb_berlin/master.m3u8"],
 ["BR Süd","https://mcdn.br.de/br/fs/bfs_sued/hls/de/master.m3u8"],
 ["NDR Hamburg","https://mcdn.ndr.de/ndr/hls/ndr_fs/ndr_hh/master.m3u8"],
 ["WDR (ww)","https://mcdn.wdr.de/wdr/wdrfs/de/master.m3u8"],
 ["WDR (de)","https://wdrfs247.akamaized.net/hls/live/681509/wdr_msl4_fs247/index.m3u8"],
 ["SWR BW","https://swrbwd-hls.akamaized.net/hls/live/2018672/swrbwd/master.m3u8"],
 ["hr","https://hrhls.akamaized.net/hls/live/2024525/hrhls/master.m3u8"],
 ["SR","https://srfs.akamaized.net/hls/live/689649/srfsgeo/index.m3u8"],
 ["Das Erste","https://daserste-live.ard-mcdn.de/daserste/live/hls/int/master.m3u8"],
 ["tagesschau24","https://tagesschau.akamaized.net/hls/live/2020115/tagesschau/tagesschau_1/master.m3u8"]
];
const t = document.getElementById('t'); window.RESULTS = {};
function test([name,url]) {
  return new Promise(res => {
    const tr = t.insertRow(); tr.insertCell().textContent = name; const c = tr.insertCell(); c.textContent = '…';
    const v = document.createElement('video'); v.muted = true; v.width = 160; const h = new Hls();
    let done = false; const fin = (ok,msg) => { if (done) return; done = true; c.textContent = msg; c.className = ok?'ok':'bad'; window.RESULTS[name] = (ok?'OK ':'FAIL ')+msg; h.destroy(); res(); };
    h.on(Hls.Events.FRAG_LOADED, () => fin(true, 'plays (segment loaded)'));
    h.on(Hls.Events.ERROR, (e,d) => { if (d.fatal) fin(false, d.details + (d.response ? ' ' + d.response.code : '')); });
    setTimeout(() => fin(false,'timeout'), 15000);
    h.loadSource(url); h.attachMedia(v); v.play().catch(()=>{});
  });
}
(async () => { for (let i=0;i<S.length;i+=4) await Promise.all(S.slice(i,i+4).map(test)); window.DONE = true; })();
</script></body></html>
