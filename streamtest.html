<!DOCTYPE html><html><head><meta charset="utf-8"><title>stream test</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
<style>body{background:#111;color:#eee;font:14px sans-serif;margin:12px}table{border-collapse:collapse}td{padding:4px 10px;border-bottom:1px solid #333}.ok{color:#4c4}.bad{color:#e55}</style></head>
<body><h3>Stream test</h3><table id="t"></table>
<script>
const S = [
 ["TeleZüri","https://cdnapisec.kaltura.com/p/1719221/sp/171922100/playManifest/entryId/1_se36k3uk/format/applehttp/protocol/https/a.m3u8"],
 ["Tele M1","https://cdnapisec.kaltura.com/p/1719221/sp/171922100/playManifest/entryId/1_ljzy3evp/format/applehttp/protocol/https/a.m3u8"],
 ["TeleTicino","https://vstream-cdn.ch/hls/teleticino.m3u8"],
 ["RTS Info","https://rtsinfo-d.akamaized.net/out/v1/2b7ae2e1ba3f43c6aba15bced153baf5/index.m3u8"],
 ["Couleur 3","https://visualradio-rts-couleur3-d.akamaized.net/out/v1/6a1472634ad745f59a9e63ee8adbbc00/index.m3u8"],
 ["Léman Bleu","https://livevideo.infomaniak.com/streaming/livecast/naxoo/playlist.m3u8"],
 ["Canal 9","https://livehd.vedge.infomaniak.com/livecast/livehd/master.m3u8"],
 ["Canal Alpha JU","https://canalalphaju.vedge.infomaniak.com/livecast/ik:canalalphaju/playlist.m3u8"],
 ["TVM3","https://livevideo.infomaniak.com/streaming/livecast/tvm3/playlist.m3u8"],
 ["Meteonews","https://streaming.meteonews.net/hls/stream.m3u8"],
 ["Radio 3i","https://vstream-cdn.ch/hls/radio3i.m3u8"]
];
const t = document.getElementById('t'); window.RESULTS = {};
function test([name,url]) {
  return new Promise(res => {
    const tr = t.insertRow(); tr.insertCell().textContent = name; const c = tr.insertCell(); c.textContent = '…';
    const v = document.createElement('video'); v.muted = true; v.width = 160; const h = new Hls();
    let done = false; const fin = (ok,msg) => { if (done) return; done = true; c.textContent = msg; c.className = ok?'ok':'bad'; window.RESULTS[name] = (ok?'OK ':'FAIL ')+msg; h.destroy(); res(); };
    h.on(Hls.Events.FRAG_LOADED, () => fin(true, 'plays (segment loaded)'));
    h.on(Hls.Events.ERROR, (e,d) => { if (d.fatal) fin(false, d.details + (d.response ? ' ' + d.response.code : '')); });
    setTimeout(() => fin(false,'timeout'), 15000);
    h.loadSource(url); h.attachMedia(v); v.play().catch(()=>{});
  });
}
(async () => { for (let i=0;i<S.length;i+=4) await Promise.all(S.slice(i,i+4).map(test)); window.DONE = true; })();
</script></body></html>
