<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTV">
<meta name="theme-color" content="#000000">
<title>MyTV · Mitschauen</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23000'/><rect x='30' y='48' width='120' height='78' rx='14' fill='none' stroke='%23fff' stroke-width='10'/><path d='M66 146h48' stroke='%23fff' stroke-width='10' stroke-linecap='round'/></svg>">
<style>
  /* the TV picture of the notebook, fullscreen; tap = small remote bar (Apple-TV style glass) */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
               font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
  .center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 24px; }
  .center[hidden] { display: none; }
  .big { width: 96px; height: 96px; border-radius: 50%; border: 0; background: rgba(255,255,255,.14); color: #fff; font-size: 40px;
         -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); transition: transform .2s; }
  .big:active { transform: scale(.92); }
  .t { font-size: 20px; font-weight: 600; }
  .s { font-size: 14px; color: rgba(235,235,245,.6); max-width: 420px; }
  .btn { border: 0; border-radius: 22px; height: 44px; padding: 0 20px; background: rgba(255,255,255,.14); color: #fff; font: inherit; font-size: 15px; font-weight: 600; }
  #bar { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 18px); transform: translate(-50%, 20px); display: flex; gap: 6px; padding: 8px;
         border-radius: 999px; background: rgba(30,30,34,.62); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
         border: .5px solid rgba(255,255,255,.08); opacity: 0; pointer-events: none; transition: opacity .3s, transform .4s cubic-bezier(.2,.9,.25,1.05); }
  #bar.on { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #bar button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: transparent; color: #fff; font: inherit; font-size: 15px; font-weight: 600; }
  #bar button:active { background: rgba(255,255,255,.18); }
  #bar .sep { width: 1px; background: rgba(255,255,255,.14); margin: 10px 4px; }
  #live { position: fixed; top: calc(env(safe-area-inset-top) + 14px); left: 16px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 6px;
          background: rgba(255,69,58,.9); opacity: 0; transition: opacity .3s; }
  #live.on { opacity: 1; }
</style>
</head>
<body>
<video id="v" playsinline webkit-playsinline></video>
<div class="center" id="start">
  <button class="big" id="go" aria-label="Mitschauen">▶︎</button>
  <div class="t">Mitschauen</div>
  <div class="s">Zeigt, was gerade auf dem Fernseher läuft – mit ein paar Sekunden Verzögerung.</div>
</div>
<div class="center" id="wait" hidden>
  <div class="t" id="waitT">Verbinde mit dem Notebook …</div>
  <div class="s" id="waitS"></div>
  <button class="btn" id="tvon" hidden>TV einschalten</button>
</div>
<div id="live">LIVE</div>
<div id="bar">
  <button data-k="ArrowDown">CH−</button><button data-k="ArrowUp">CH+</button>
  <span class="sep"></span>
  <button data-k="g">Guide</button><button data-k="l">Liste</button><button data-k="Enter">OK</button><button data-k="Backspace">‹</button>
  <span class="sep"></span>
  <button data-k="-">−</button><button data-k="m">🔇</button><button data-k="+">+</button>
</div>
<script>
(() => {
  const key = new URLSearchParams(location.search).get('key') || '';
  const $ = id => document.getElementById(id);
  const v = $('v');
  const api = async (p, q = '') => (await fetch(p + '?key=' + encodeURIComponent(key) + q, { cache: 'no-store' })).json();
  const wait = (t, s) => { $('start').hidden = true; $('wait').hidden = !t; $('waitT').textContent = t || ''; $('waitS').textContent = s || ''; };
  let keepT = null, hls = null, stalls = 0;

  async function start() {
    wait('Starte Übertragung …', 'Das Notebook nimmt das TV-Bild auf, das dauert ein paar Sekunden.');
    try {
      const j = await api('/cast/start');
      if (!j.ok) { wait('Übertragung nicht möglich', j.error || ''); $('tvon').hidden = false; return; }
    } catch (e) { wait('Notebook nicht erreichbar', 'Bist du im Heim-WLAN?'); return; }
    // wait until the first segments exist
    for (let i = 0; i < 30; i++) {
      await new Promise(r => setTimeout(r, 1000));
      let st = null; try { st = await api('/cast/status'); } catch (e) {}
      if (st && st.ready) break;
      if (st && !st.running) { wait('Aufnahme gestoppt', st.log || 'FFmpeg auf dem Notebook prüfen'); return; }
    }
    play();
    clearInterval(keepT); keepT = setInterval(() => api('/cast/status').catch(() => {}), 15000);   // "still watching"
  }
  function play() {
    const src = '/cast/index.m3u8?key=' + encodeURIComponent(key);
    if (v.canPlayType('application/vnd.apple.mpegurl')) v.src = src;                       // Safari / iPad: native
    else if (window.Hls) { hls = new Hls({ liveSyncDurationCount: 2 }); hls.loadSource(src); hls.attachMedia(v); }
    else { wait('Dieser Browser kann den Stream nicht abspielen', 'Auf dem iPad/iPhone Safari verwenden.'); return; }
    v.play().then(() => { wait(''); $('live').classList.add('on'); }).catch(() => { $('start').hidden = false; $('wait').hidden = true; });
  }
  // stuck? jump back to the live edge / reload the playlist
  v.addEventListener('waiting', () => { if (++stalls > 3) { stalls = 0; v.src = v.src; v.play().catch(() => {}); } });
  v.addEventListener('playing', () => { stalls = 0; });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { v.pause(); }
    else if (v.src) { api('/cast/start').then(() => { v.src = v.src; v.play().catch(() => {}); }).catch(() => {}); }
  });

  $('go').addEventListener('click', () => { v.muted = false; start(); });
  $('tvon').addEventListener('click', () => fetch('/cmd?key=' + encodeURIComponent(key) + '&do=on'));

  // tap = show the remote bar for 4 s
  let barT = null;
  const showBar = () => { $('bar').classList.add('on'); clearTimeout(barT); barT = setTimeout(() => $('bar').classList.remove('on'), 4000); };
  v.addEventListener('click', showBar);
  document.querySelectorAll('#bar [data-k]').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); showBar();
    fetch('/cmd?key=' + encodeURIComponent(key) + '&do=key&k=' + encodeURIComponent(b.dataset.k)).catch(() => {});
  }));
  if (!key) wait('Link ohne key=…', 'Den Link aus der Fernbedienung verwenden (Einstellungen → Mitschauen).');
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js" async></script>
</body>
</html>
