<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyTV">
<meta name="theme-color" content="#0b0d11">
<title>MyTV Remote</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230b0d11'/><rect x='30' y='48' width='120' height='78' rx='12' fill='none' stroke='%23ffcc33' stroke-width='10'/><path d='M66 146h48' stroke='%23ffcc33' stroke-width='10' stroke-linecap='round'/></svg>">
<style>
  :root { --bg:#0b0d11; --card:#171b24; --card2:#222835; --text:#eef0f3; --muted:#8d939c; --accent:#ffcc33; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.3 -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 20px); max-width: 460px; margin: 0 auto;
         -webkit-user-select: none; user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; } h1 b { color: var(--accent); }
  #st { font-size: 13px; color: var(--muted); }
  #st.err { color: #ff7a7a; }
  button { font: inherit; color: var(--text); background: var(--card); border: 0; border-radius: 16px; min-height: 54px; font-weight: 700;
           touch-action: manipulation; transition: transform .06s, background .06s; }
  button:active, button.hit { transform: scale(.94); background: var(--card2); }
  .row { display: grid; gap: 10px; margin-bottom: 10px; }
  .c2 { grid-template-columns: 1fr 1fr; } .c3 { grid-template-columns: repeat(3, 1fr); } .c4 { grid-template-columns: repeat(4, 1fr); }
  .on { background: var(--accent); color: #111; font-size: 18px; }
  .on:active { background: #e6b82e; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 66px); gap: 8px; margin: 14px auto; max-width: 300px; }
  .pad button { font-size: 24px; }
  .pad .ok { border-radius: 50%; background: var(--accent); color: #111; font-size: 18px; }
  .ch { display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
  .lbl { font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; margin-top: -2px; }
  h2 { font-size: 15px; color: var(--muted); margin: 22px 0 10px; font-weight: 700; }
  #num { text-align: center; font-size: 30px; font-weight: 800; color: var(--accent); min-height: 38px; letter-spacing: .1em; }
  #list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #list button { min-height: 48px; text-align: left; padding: 8px 12px; font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  #list button span { color: var(--accent); font-weight: 800; min-width: 2.2ch; text-align: right; }
  #list button i { font-style: normal; font-size: 11px; color: var(--muted); margin-left: auto; }
</style>
</head>
<body>
<header><h1>My<b>TV</b></h1><div id="st">bereit</div></header>

<div class="row"><button class="on" data-do="on">⏻&nbsp; TV an / aufwecken</button></div>

<div class="row c4">
  <button data-k="g">Guide</button><button data-k="l">Liste</button><button data-k="b">Mediathek</button><button data-k="i">Info</button>
</div>

<div class="pad">
  <div></div><button data-k="ArrowUp">▲</button><div></div>
  <button data-k="ArrowLeft">◀</button><button class="ok" data-k="Enter">OK</button><button data-k="ArrowRight">▶</button>
  <div></div><button data-k="ArrowDown">▼</button><div></div>
</div>
<div class="lbl">▲▼ = Sender hoch/runter · im Guide / in der Mediathek = navigieren</div>

<div class="row c4" style="margin-top:14px">
  <button data-k="Backspace">↩︎ Zurück</button><button data-k="-">🔉 −</button><button data-k="m">🔇</button><button data-k="+">🔊 +</button>
</div>

<h2>Sendernummer</h2>
<div id="num"></div>
<div class="row c3" id="digits">
  <button>1</button><button>2</button><button>3</button><button>4</button><button>5</button><button>6</button>
  <button>7</button><button>8</button><button>9</button><button data-clear>⌫</button><button>0</button><button class="on" data-go>OK</button>
</div>

<h2>Sender</h2>
<div id="list"></div>

<script>
(() => {
  const key = new URLSearchParams(location.search).get('key') || '';
  const st = document.getElementById('st');
  const say = (t, err) => { st.textContent = t; st.className = err ? 'err' : ''; };
  async function send(q) {
    try {
      const r = await fetch('/cmd?key=' + encodeURIComponent(key) + '&' + q, { cache: 'no-store' });
      const j = await r.json();
      say(j.ok ? 'gesendet ✓' : (j.error || 'Fehler'), !j.ok);
    } catch (e) { say('Notebook nicht erreichbar', true); }
  }
  // buttons
  document.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => send('do=key&k=' + encodeURIComponent(b.dataset.k))));
  document.querySelectorAll('[data-do]').forEach(b => b.addEventListener('click', () => send('do=' + b.dataset.do)));
  // number pad
  let num = '', numT = null;
  const numEl = document.getElementById('num');
  const goNum = () => { clearTimeout(numT); if (num) send('do=ch&n=' + parseInt(num, 10)); num = ''; setTimeout(() => numEl.textContent = '', 600); };
  document.querySelectorAll('#digits button').forEach(b => b.addEventListener('click', () => {
    if (b.hasAttribute('data-go')) return goNum();
    if (b.hasAttribute('data-clear')) { num = num.slice(0, -1); numEl.textContent = num; return; }
    num = (num + b.textContent).slice(-3); numEl.textContent = num;
    clearTimeout(numT); numT = setTimeout(goNum, 1500);
  }));
  // channel list from MyTV
  const s = document.createElement('script');
  s.src = 'https://mistergeil.github.io/MyTV/channels.js?r=' + Date.now();
  s.onload = () => {
    const list = document.getElementById('list');
    (window.CHANNELS || []).forEach(c => {
      const b = document.createElement('button');
      const tag = c.geo === 'CH' ? 'CH' : c.geo === 'AT' ? 'AT' : c.geo ? 'DE' : '';
      b.innerHTML = '<span>' + c.number + '</span>' + c.name.replace(/[<>&]/g, '') + (tag ? '<i>' + tag + '</i>' : '');
      b.addEventListener('click', () => send('do=ch&n=' + c.number));
      list.appendChild(b);
    });
  };
  s.onerror = () => { document.getElementById('list').textContent = 'Senderliste nicht geladen (Internet?)'; };
  document.head.appendChild(s);
  if (!key) say('Link ohne key=…', true);
  // sticker link ...&on=1 → switch the TV on right away (once; the parameter is removed so a reload doesn't repeat it)
  const qp = new URLSearchParams(location.search);
  if (key && qp.get('on') === '1') {
    qp.delete('on'); history.replaceState(null, '', location.pathname + '?' + qp.toString());
    send('do=on'); say('TV wird eingeschaltet …');
  }
})();
</script>
</body>
</html>
